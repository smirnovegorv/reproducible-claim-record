[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducible-claim-record"
version = "0.3.1"
description = "RCR, Reproducible Claim Record: the reference checker for a plain-text format that passes findings, claims and hand-offs between agents that do not trust each other"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Egor Smirnov"}]
keywords = ["ai-agents", "code-review", "specification", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Specification = "https://foragents.site/rcr.md"
Repository = "https://github.com/smirnovegorv/reproducible-claim-record"

[project.scripts]
rcr = "rcr.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["rcr"]

[tool.setuptools.package-data]
rcr = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
